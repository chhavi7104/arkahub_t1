<div class="auth-wrapper">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-card">
    <h1 class="auth-title">Smart Banking</h1>
    <p class="auth-subtitle">Log in to your account</p>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" />
      <span class="error-text" *ngIf="f['username'].touched && f['username'].errors?.['required']">
        Username is required.
      </span>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
      <span class="error-text" *ngIf="f['password'].touched && f['password'].errors?.['required']">
        Password is required.
      </span>
    </div>

    <div class="error-text" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" class="btn-primary" [disabled]="submitting">
      {{ submitting ? 'Logging in...' : 'Log In' }}
    </button>

    <p class="auth-footer">Don't have an account? <a routerLink="/register">Register</a></p>
  </form>
</div>
