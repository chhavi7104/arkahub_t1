<div class="auth-wrapper">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-card">
    <h1 class="auth-title">Smart Banking</h1>
    <p class="auth-subtitle">Create your account</p>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" />
      <span class="error-text" *ngIf="f['username'].touched && f['username'].errors?.['required']">
        Username is required.
      </span>
      <span class="error-text" *ngIf="f['username'].touched && f['username'].errors?.['minlength']">
        Username must be at least 3 characters.
      </span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <span class="error-text" *ngIf="f['email'].touched && f['email'].errors?.['required']">
        Email is required.
      </span>
      <span class="error-text" *ngIf="f['email'].touched && f['email'].errors?.['email']">
        Enter a valid email.
      </span>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
      <span class="error-text" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
        Password must be at least 6 characters.
      </span>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" />
      <span class="error-text" *ngIf="registerForm.errors?.['passwordMismatch'] && f['confirmPassword'].touched">
        Passwords do not match.
      </span>
    </div>

    <div class="error-text" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" class="btn-primary" [disabled]="submitting">
      {{ submitting ? 'Creating account...' : 'Register' }}
    </button>

    <p class="auth-footer">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</div>
