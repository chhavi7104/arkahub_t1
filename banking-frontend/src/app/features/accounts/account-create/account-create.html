<h1 class="page-title">Create Account</h1>

<form [formGroup]="accountForm" (ngSubmit)="onSubmit()" class="form-card">
  <div class="form-group">
    <label for="accountHolderName">Account Holder Name</label>
    <input id="accountHolderName" type="text" formControlName="accountHolderName" />
    <span class="error-text" *ngIf="f['accountHolderName'].touched && f['accountHolderName'].errors?.['required']">
      Name is required.
    </span>
    <span class="error-text" *ngIf="f['accountHolderName'].touched && f['accountHolderName'].errors?.['minlength']">
      Name must be at least 3 characters.
    </span>
  </div>

  <div class="form-group">
    <label for="initialBalance">Initial Balance</label>
    <input id="initialBalance" type="number" formControlName="initialBalance" />
    <span class="error-text" *ngIf="f['initialBalance'].touched && f['initialBalance'].errors?.['required']">
      Initial balance is required.
    </span>
    <span class="error-text" *ngIf="f['initialBalance'].touched && f['initialBalance'].errors?.['min']">
      Balance cannot be negative.
    </span>
  </div>

  <div class="error-text" *ngIf="errorMessage">{{ errorMessage }}</div>

  <button type="submit" class="btn-primary" [disabled]="submitting">
    {{ submitting ? 'Creating...' : 'Create Account' }}
  </button>
</form>
